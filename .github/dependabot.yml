version: 2

# Weekly update pull requests. The 7-day cooldown skips brand-new releases, which is when a
# hijacked package or action is most likely to be live. Security updates ignore the cooldown.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # @astrojs/check accepts TypeScript 5 and 6 only, so a TypeScript 7 bump cannot install. Skip
    # major versions until it does; minor and patch updates still come in the tooling group.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tooling:
        patterns: ["@biomejs/biome", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
