name: Release

# On every push to main: rebuild and verify, then sign what was built. The site tarball gets a
# build provenance attestation and an SBOM attestation, both tied to this workflow run. The deploy
# job then checks those signatures and ships that exact tarball, so what runs on jarrettd.com can
# be traced back to this commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  attest:
    name: Build, SBOM and attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Software bill of materials
        run: npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > sbom.cdx.json
      - name: Pack the site
        # Sorted, fixed timestamps and no gzip header time, so the same build gives the same hash.
        run: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C dist . | gzip -n > site-dist.tar.gz
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: site-dist.tar.gz
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: site-dist.tar.gz
          sbom-path: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            site-dist.tar.gz
            sbom.cdx.json
          retention-days: 90

  deploy:
    name: Deploy to Cloudflare
    needs: attest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The Cloudflare token lives in this environment's secrets, not in the repository's.
    environment: production
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Check the signatures before shipping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify site-dist.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify site-dist.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://cyclonedx.org/bom
      - name: Unpack the site
        run: mkdir dist && tar -xzf site-dist.tar.gz -C dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          command: deploy
      - name: Check the live site
        # The custom domain can take a minute to answer after the first deploy.
        run: |
          for attempt in 1 2 3 4 5; do
            python3 scripts/check_headers.py --url https://jarrettd.com && exit 0
            sleep 20
          done
          exit 1
